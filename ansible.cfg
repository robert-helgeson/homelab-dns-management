[defaults]
inventory = inventory.ini
library = ./library
host_key_checking = False
retry_files_enabled = False
# Use the built-in default callback with YAML result formatting. Works
# on ansible-core 2.13 (CI runner) through current. The old
# `stdout_callback = yaml` pointed at community.general.yaml, which
# was removed in community.general 12.0.
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
forks = 5

[ssh_connection]
pipelining = True
