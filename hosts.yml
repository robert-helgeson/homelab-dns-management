---
# Source of truth for DNS records, NPM proxies, and firewall rules.
#
# Editing rules:
# - To add a host on primary-dns: add an entry to `cnames` with target: "@"
# - To add a host with a dedicated IP: add to `a_records`
# - To add a host aliased to ns2: add cname with target: ns2
# - Order within each list controls zone file output order
# - CNAME targets can be: "@" (zone apex), another shortname, or a FQDN

zones:
  - name: homelab.example.com
    managed: true
    ttl: 86400
    apex_ip: 10.0.0.19
    admin_email: info   # becomes info.homelab.example.com. in SOA
    soa:
      refresh: 12h
      retry: 15m
      expire: 3w
      minimum: 2h

    nameservers:
      - name: ns1
        ip: 10.0.0.19
      - name: ns2
        ip: 10.0.0.2

    a_records:
      - { name: cluster,      ip: 10.0.2.180 }
      - { name: watchdog-pi,  ip: 10.0.0.2   }
      - { name: cluster1,     ip: 10.0.0.175 }
      - { name: cluster2,     ip: 10.0.0.176 }
      - { name: cluster3,     ip: 10.0.0.177 }
      - { name: testing-host, ip: 10.0.0.107 }

    cnames:
      # Most services point at the primary; CNAMEs keep zone file diffs small
      - { name: gitlab,        target: "@" }
      - { name: media,         target: "@" }
      - { name: wiki,          target: "@" }
      - { name: monitoring,    target: "@" }
      - { name: home,          target: "@" }
      - { name: registry,      target: "@" }
      - { name: primary-dns,   target: "@" }
      # Services on the secondary nameserver
      - { name: status,        target: ns2 }
      - { name: nginx-backup,  target: ns2 }

# NPM (Nginx Proxy Manager) instances and proxy entries

npms:
  npm_primary:
    api_url: http://10.0.0.19:81
    email:    "{{ lookup('env', 'NPM_EMAIL')    | default('', true) }}"
    password: "{{ lookup('env', 'NPM_PASSWORD') | default('', true) }}"
    validate_certs: false

proxies:
  # Simple proxy: bare minimum, all other fields take NPM defaults
  - domain: media.homelab.example.com
    npm_target: npm_primary
    forward_host: 10.0.0.19
    forward_port: 8000

  # Proxy with explicit cert and SSL forced
  - domain: wiki.homelab.example.com
    npm_target: npm_primary
    forward_host: 10.0.0.19
    forward_port: 3000
    certificate_id: 1
    ssl_forced: true

  # Proxmox node with self-signed backend - shows advanced_config usage
  - domain: pve1.homelab.example.com
    npm_target: npm_primary
    forward_host: 10.0.0.50
    forward_port: 8006
    forward_scheme: https
    advanced_config: |
      proxy_ssl_verify off;
      proxy_redirect off;
      proxy_http_version 1.1;

# firewalld port reconciliation
# One entry per target host, with a dict of zones. Each zone has its own
# sources, services, tcp, and udp lists.

firewall:
  primary-dns:
    zones:
      trusted-base:
        sources: [10.99.0.0/16]
        services: [mountd, ntp, rpc-bind, samba, ssh]
        tcp: [53, 80, 81, 443, 5432, 8080]
        udp: [53, 1161]
      trusted-lan:
        sources:
          - 10.0.0.0/24
          - 10.0.1.0/24
          - 10.0.2.0/24
          - 10.0.3.0/24
        services: [mountd, ntp, rpc-bind, samba, ssh]
        tcp: [22, 53, 80, 443, 9090]
        udp: [53, 67, 68]
